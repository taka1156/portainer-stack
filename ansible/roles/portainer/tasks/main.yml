---
# ── 1. Create Portainer data volume ─────────────────────────────────────────
- name: Create Portainer data volume
  community.docker.docker_volume:
    name: "{{ portainer_data_volume }}"
    state: present

# ── 2. Pull Portainer image ──────────────────────────────────────────────────
- name: Pull Portainer CE image
  community.docker.docker_image:
    name: "{{ portainer_image }}"
    source: pull
    force_source: false

# ── 3. Deploy Portainer container ────────────────────────────────────────────
- name: Deploy Portainer CE container
  community.docker.docker_container:
    name: "{{ portainer_container_name }}"
    image: "{{ portainer_image }}"
    state: started
    restart_policy: always
    ports:
      - "{{ portainer_edge_port }}:8000"
      - "{{ portainer_https_port }}:9443"
      - "{{ portainer_http_port }}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ portainer_data_volume }}:/data"
  register: portainer_container

# ── 4. Wait for Portainer to be ready ───────────────────────────────────────
- name: Wait for Portainer to be ready
  uri:
    url: "http://localhost:{{ portainer_http_port }}/api/system/status"
    method: GET
    status_code: 200
  register: portainer_status
  until: portainer_status.status == 200
  retries: 10
  delay: 5
  when: portainer_container.changed
